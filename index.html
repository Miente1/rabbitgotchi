<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=240, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Rabbitgotchi</title>
<style>
  html,body{margin:0;padding:0;background:#111;overflow:hidden;}
  body{display:flex;align-items:center;justify-content:center;height:100vh;font-family:'Courier New',monospace;-webkit-user-select:none;user-select:none;}
  #app{width:240px;height:282px;position:relative;background:#000;border:2px solid #333;box-shadow:0 0 12px rgba(0,0,0,.6);overflow:hidden;}

  #stats{height:24px;display:flex;align-items:center;justify-content:space-around;background:#1a1a1a;padding:0 2px;box-sizing:border-box;}
  .stat{display:flex;align-items:center;font-size:9px;color:#ddd;gap:2px;}
  .bar{width:28px;height:6px;background:#333;border:1px solid #555;position:relative;}
  .bar>i{position:absolute;left:0;top:0;bottom:0;display:block;}
  .b-hunger>i{background:#e8a33d;}
  .b-happy>i{background:#e84dd6;}
  .b-energy>i{background:#4dc9e8;}
  .b-health>i{background:#4de861;}

  .disc-bar{width:140px;height:10px;background:#333;border:1px solid #555;border-radius:4px;position:relative;overflow:hidden;}
  .disc-bar>i{position:absolute;left:0;top:0;bottom:0;background:#ffd75e;display:block;transition:width .2s;}

  #stage-canvas{display:block;background:#cfe8ff;}

  #menu{height:48px;display:flex;background:#1a1a1a;}
  .icon-btn{flex:1;display:flex;align-items:center;justify-content:center;font-size:18px;color:#ccc;background:#222;border-top:2px solid #000;box-sizing:border-box;}
  .icon-btn.selected{background:#3a3a3a;border-top:2px solid #4de861;color:#fff;}

  #toast{position:absolute;top:40px;left:50%;transform:translateX(-50%) scale(.85);max-width:172px;text-align:center;font-size:10px;font-weight:bold;color:#111;background:#fff;border:2px solid #111;border-radius:14px;padding:6px 10px;opacity:0;pointer-events:none;transition:opacity .15s, transform .15s;box-shadow:2px 2px 0 rgba(0,0,0,.2);}
  #toast.show{opacity:1;transform:translateX(-50%) scale(1);}
  #toast::before,#toast::after{content:'';position:absolute;left:50%;transform:translateX(-50%);border-style:solid;}
  #toast::before{bottom:-10px;border-width:10px 8px 0 8px;border-color:#111 transparent transparent transparent;}
  #toast::after{bottom:-7px;border-width:7px 6px 0 6px;border-color:#fff transparent transparent transparent;}

  #overlay{position:absolute;inset:0;background:rgba(0,0,0,.85);color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:12px;gap:10px;padding:10px;box-sizing:border-box;}
  #overlay.show{display:flex;}
  #overlay button{font-family:inherit;font-size:11px;padding:6px 14px;background:#4de861;border:none;color:#000;}

  @keyframes mgCelebrate { 0%{transform:scale(.3) rotate(-10deg);opacity:0;} 60%{transform:scale(1.3) rotate(5deg);opacity:1;} 100%{transform:scale(1) rotate(0);opacity:1;} }
  @keyframes mgIrritate { 0%,100%{transform:translateX(0);} 20%{transform:translateX(-7px);} 40%{transform:translateX(7px);} 60%{transform:translateX(-5px);} 80%{transform:translateX(5px);} }
  .mg-win{ animation: mgCelebrate .5s ease; }
  .mg-lose{ animation: mgIrritate .5s ease; }

  #hud{position:absolute;top:26px;left:3px;font-size:8px;color:#333;text-shadow:0 1px 0 rgba(255,255,255,.3);}
  #diag{position:absolute;top:228px;right:3px;font-size:7px;color:rgba(255,255,255,.55);}
</style>
</head>
<body>
<div id="app">
  <div id="stats">
    <div class="stat">🍔<div class="bar b-hunger"><i style="width:100%"></i></div></div>
    <div class="stat">🙂<div class="bar b-happy"><i style="width:100%"></i></div></div>
    <div class="stat">⚡<div class="bar b-energy"><i style="width:100%"></i></div></div>
    <div class="stat">❤<div class="bar b-health"><i style="width:100%"></i></div></div>
  </div>

  <canvas id="stage-canvas" width="240" height="210"></canvas>
  <div id="hud"></div>
  <div id="diag"></div>

  <div id="menu"></div>

  <div id="toast"></div>
  <div id="overlay"></div>
</div>

<script>
(function(){
"use strict";

/* ---------- Constants ---------- */
var BUILD_ID = 'b23'; // bump on every deploy — shown on screen so we can tell if the device is running stale cached code
var MIN = 60*1000, HOUR = 60*MIN, DAY = 24*HOUR;
var EGG_HATCH_MS   = 5*MIN;
var BABY_TO_CHILD  = 1*DAY;
var CHILD_TO_TEEN  = 3*DAY;
var TEEN_TO_ADULT  = 5*DAY;

// Total lifespan (from hatch) is decided at the adult checkpoint based on
// care quality so far (same mistake counter that decides evolutionForm).
// A real Tamagotchi averages ~2 weeks; here that's the "normal care" tier.
var LIFESPAN_GREAT     = 21*DAY;
var LIFESPAN_NORMAL    = 14*DAY;
var LIFESPAN_NEGLECTED = 7*DAY;
var YEARS_PER_MS = 70 / LIFESPAN_NORMAL; // fixed scale: 70 "life years" == the 14-day normal lifespan

var HUNGER_RATE   = 100/(6*60);   // per minute, empty in 6h
var HAPPY_RATE    = 100/(8*60);   // empty in 8h
var ENERGY_AWAKE  = 100/(10*60);  // empty in 10h awake
var ENERGY_SLEEP  = 100/(4*60);   // full recharge in 4h sleep
var POOP_CHANCE_PER_MIN = 1/180;  // ~1 poop every 3h on average
var SICK_BASE_RISK_PER_MIN = 0.001; // ambient sickness risk even under good care — ~75-80% chance of at least one bout over the ~24h baby stage
var NAUGHTY_MIN_GAP = 20*HOUR, NAUGHTY_MAX_GAP = 28*HOUR; // scheduled (not random-roll) so it's reliably ~once/day, not just an average
var NAUGHTY_WINDOW_MS = 3*HOUR; // time to catch a false call via Discipline before it counts as a missed mistake
var DISCIPLINE_MAX = 5; // fills over the ~5-day growth window at ~1 naughty episode/day

var ATTITUDE_MIN_MS = 25*1000, ATTITUDE_MAX_MS = 40*1000;
var ATTITUDE_LINES = {
  egg:     ['*wiggle*', '...', 'something\'s moving in there', '*tap tap*', 'hello? anyone there?'],
  sick:    ['I don\'t feel so good...', '*cough*', 'everything\'s spinny...', 'ugh...'],
  naughty: ['hmph!', 'not until you discipline me!', 'no way.', '*crosses arms*', 'make me.'],
  hungry:  ['my tummy is rumbling...', 'got any snacks?', '*stomach growls*', 'feed me?'],
  tired:   ['I\'m so sleepy...', 'can I nap?', '*yawns*', 'zzz... huh, what?', 'so tired...'],
  dirty:   ['it\'s a bit messy in here...', 'ahem, could you clean up?', '*sniffs* something smells...'],
  bored:   ['I\'m bored...', 'nobody\'s paying attention to me', '*sigh*', 'play with me?', 'entertain me!'],
  sassy:   ['hmph.', 'whatever.', 'oh, it\'s you.', '*rolls eyes*', 'what do YOU want'],
  sweet:   ['*nuzzles*', 'you\'re the best!', 'yay, you\'re here!', '<3'],
  happy:   ['!', 'la la la~', '*happy wiggle*', 'life is good!', '*hums a little tune*', 'wheee!'],
  petted:  ['♥', 'that feels nice!', '*happy wiggle*', 'more please!', 'yay!', 'hehe~', '*melts*']
};

var ICONS = [
  {id:'feed',       label:'🍔', name:'Feed'},
  {id:'play',       label:'🎮', name:'Play'},
  {id:'clean',      label:'🧹', name:'Clean'},
  {id:'med',        label:'💊', name:'Medicine'},
  {id:'sleep',      label:'💤', name:'Sleep'},
  {id:'discipline', label:'✋',       name:'Scold'}
];

var STORE_KEY = 'rabbitgotchi_state_v1';

/* ---------- Storage ----------
   Writes to BOTH window.creationStorage.plain (the real R1 API) and
   localStorage on every save, and reads back whichever one actually has
   data. This is deliberately redundant: if the device storage API silently
   fails (e.g. an unhandled promise rejection), the localStorage copy still
   saves the game instead of losing it.
   get() resolves {value, source} where source is 'device'|'local'|'none'
   so the caller can show/log exactly what happened — there is no console
   access on-device, so this is the only way to diagnose storage failures
   there. */
var Diag = { hasDeviceStorage: !!(window.creationStorage && window.creationStorage.plain), lastSaveOk: null };

var Storage = {
  get: function(key){
    return new Promise(function(resolve){
      var local = fallbackGet(key);
      try {
        if (window.creationStorage && window.creationStorage.plain && window.creationStorage.plain.getItem) {
          Promise.resolve(window.creationStorage.plain.getItem(key)).then(function(raw){
            if (!raw) return resolve({value: local, source: local ? 'local' : 'none'});
            try { resolve({value: JSON.parse(decodeURIComponent(escape(atob(raw)))), source: 'device'}); }
            catch(e){ resolve({value: local, source: local ? 'local' : 'none'}); }
          }).catch(function(){ resolve({value: local, source: local ? 'local' : 'none'}); });
        } else {
          resolve({value: local, source: local ? 'local' : 'none'});
        }
      } catch(e){
        resolve({value: local, source: local ? 'local' : 'none'});
      }
    });
  },
  set: function(key, value){
    var json = JSON.stringify(value);
    var localOk = false;
    try { localStorage.setItem(key, json); localOk = true; } catch(e){}
    Diag.lastSaveOk = localOk;
    if (window.creationStorage && window.creationStorage.plain && window.creationStorage.plain.setItem) {
      try {
        Promise.resolve(window.creationStorage.plain.setItem(key, btoa(unescape(encodeURIComponent(json)))))
          .catch(function(){ /* localStorage copy above already covers this */ });
      } catch(e){ /* localStorage copy above already covers this */ }
    }
    return Promise.resolve();
  }
};
function fallbackGet(key){
  try { var raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : null; }
  catch(e){ return null; }
}

/* ---------- State ---------- */
function freshState(){
  var now = Date.now();
  return {
    stage:'egg', born:now, hatchedAt:null,
    hunger:100, happiness:100, energy:100, health:100, weight:20,
    poop:0, mistakes:0, discipline:0, sick:false, naughty:false, naughtyStat:null, naughtyDeadline:null, nextNaughtyAt:null, asleep:false, alive:true,
    lastTick: now, flags:{}, deathReason:null, evolutionForm:null, lifespanMs:null,
    soundOn:true, firstRun:true
  };
}
var state = null;
var selected = 0;
var longPressActive = false;

function clamp(v){ return Math.max(0, Math.min(100, v)); }

function markMistake(flag){
  if (!state.flags[flag]){ state.flags[flag] = true; state.mistakes++; }
}
function clearFlag(flag){ state.flags[flag] = false; }

/* ---------- Simulation ---------- */
function hatch(){
  state.stage = 'baby';
  state.hatchedAt = Date.now();
  state.nextNaughtyAt = state.hatchedAt + 12*HOUR + Math.random()*12*HOUR; // first episode within 12-24h
  beep(1200,0.12); beep(1600,0.12);
  showToast('It hatched!');
}

function die(reason){
  state.alive = false;
  state.deathReason = reason;
  beep(200,0.4);
}

function checkEvolution(){
  if (!state.hatchedAt) return;
  var age = Date.now() - state.hatchedAt;
  if (state.stage === 'baby' && age >= BABY_TO_CHILD){
    state.stage = 'child'; beep(900,0.1); showToast('Grew into a child!');
  } else if (state.stage === 'child' && age >= CHILD_TO_TEEN){
    state.stage = 'teen'; beep(900,0.1); showToast('Grew into a teen!');
  } else if (state.stage === 'teen' && age >= TEEN_TO_ADULT){
    state.stage = 'adult';
    var netMistakes = Math.max(0, state.mistakes - state.discipline);
    if (netMistakes <= 1){
      state.evolutionForm = 'good';
      state.lifespanMs = LIFESPAN_GREAT;
    } else if (netMistakes <= 4){
      state.evolutionForm = 'good';
      state.lifespanMs = LIFESPAN_NORMAL;
    } else {
      state.evolutionForm = 'bad';
      state.lifespanMs = LIFESPAN_NEGLECTED;
    }
    beep(1400,0.15); beep(1800,0.2);
    showToast('Evolved into an adult!');
  }
}

function checkOldAge(){
  if (!state.alive || !state.lifespanMs || !state.hatchedAt) return;
  if (Date.now() - state.hatchedAt >= state.lifespanMs) die('old age');
}

function applyDecay(deltaMs){
  if (!state.alive) return;
  var dMin = deltaMs / MIN;

  if (state.stage === 'egg'){
    if (Date.now() - state.born >= EGG_HATCH_MS) hatch();
    return;
  }

  checkEvolution();
  checkOldAge();
  if (!state.alive) return;

  if (!state.asleep){
    state.hunger    = clamp(state.hunger    - HUNGER_RATE * dMin);
    state.happiness = clamp(state.happiness - HAPPY_RATE  * dMin);
    state.energy    = clamp(state.energy    - ENERGY_AWAKE * dMin);
  } else {
    state.energy = clamp(state.energy + ENERGY_SLEEP * dMin);
    state.hunger = clamp(state.hunger - HUNGER_RATE * 0.4 * dMin);
  }

  if (Math.random() < POOP_CHANCE_PER_MIN * dMin) state.poop = Math.min(state.poop + 1, 8);

  if (!state.sick){
    var risk = SICK_BASE_RISK_PER_MIN; // small ambient risk even under good care
    if (state.poop >= 4) risk += 0.02;
    if (state.hunger <= 10) risk += 0.02;
    if (state.happiness <= 10) risk += 0.02;
    if (Math.random() < risk * dMin) state.sick = true;
  }

  if (!state.naughty && !state.asleep && state.nextNaughtyAt && Date.now() >= state.nextNaughtyAt){
    state.naughty = true;
    state.nextNaughtyAt = Date.now() + NAUGHTY_MIN_GAP + Math.random() * (NAUGHTY_MAX_GAP - NAUGHTY_MIN_GAP);

    // Pick whichever need is most clearly fine right now and have it falsely
    // cry about THAT, using the exact same lines a genuine call would use —
    // the player has to actually check the bar to tell it's a lie.
    var candidates = [
      ['hunger', state.hunger, ATTITUDE_LINES.hungry],
      ['happiness', state.happiness, ATTITUDE_LINES.bored],
      ['energy', state.energy, ATTITUDE_LINES.tired]
    ];
    candidates.sort(function(a, b){ return b[1] - a[1]; });
    state.naughtyStat = candidates[0][0];
    state.naughtyDeadline = Date.now() + NAUGHTY_WINDOW_MS;
    showToast(pick(candidates[0][2]));
    startAnim('shake');
    beep(500, 0.1);
  }

  if (state.naughty && state.naughtyDeadline && !state.asleep && Date.now() > state.naughtyDeadline){
    state.mistakes++;
    state.naughty = false;
    state.naughtyStat = null;
    state.naughtyDeadline = null;
    showToast('Missed it... 😕');
  }

  var healthDelta = 0;
  if (state.hunger <= 0){ healthDelta -= 3*dMin; markMistake('starve'); } else clearFlag('starve');
  if (state.happiness <= 0){ healthDelta -= 2*dMin; markMistake('sad'); } else clearFlag('sad');
  if (state.poop >= 5){ healthDelta -= 2*dMin; markMistake('dirty'); } else clearFlag('dirty');
  if (state.sick) healthDelta -= 4*dMin;
  if (healthDelta === 0 && state.hunger > 50 && state.happiness > 50 && state.poop < 3){
    healthDelta += 1*dMin;
  }
  state.health = clamp(state.health + healthDelta);
  if (state.health <= 0) die('neglect');
}

/* ---------- Actions ---------- */
function requireAliveAwakeGrown(){
  return state.alive && state.stage !== 'egg';
}

function doFeed(){
  if (!requireAliveAwakeGrown()) return;
  if (state.asleep){ showToast("It's asleep..."); return; }
  if (state.naughty){ showToast('It refuses to eat!'); beep(300,0.12); startAnim('shake'); return; }
  feedChoice = { choice: 0 };
  renderFeedChoice();
}

/* ---------- Feed choice: visible Meal/Snack selection ---------- */
var feedChoice = null; // transient, not persisted: {choice} 0=Meal,1=Snack

function renderFeedChoice(){
  if (!feedChoice) return;
  overlay.innerHTML = '';

  var title = document.createElement('div');
  title.textContent = 'Feed';

  var choices = document.createElement('div');
  choices.style.display = 'flex'; choices.style.gap = '10px'; choices.style.marginTop = '6px';
  ['🍔 Meal', '🍪 Snack'].forEach(function(label, i){
    var b = document.createElement('div');
    b.textContent = label;
    b.style.padding = '8px 12px';
    b.style.border = '2px solid ' + (i === feedChoice.choice ? '#4de861' : '#555');
    b.style.borderRadius = '8px';
    b.style.fontSize = '11px';
    b.addEventListener('click', function(){ feedChoice.choice = i; confirmFeedChoice(); });
    choices.appendChild(b);
  });

  var hint = document.createElement('div');
  hint.style.fontSize = '8px'; hint.style.color = '#999'; hint.style.marginTop = '8px';
  hint.textContent = 'scroll to choose, press to confirm';

  overlay.appendChild(title); overlay.appendChild(choices); overlay.appendChild(hint);
  overlay.classList.add('show');
}

function confirmFeedChoice(){
  if (!feedChoice) return;
  var isSnack = feedChoice.choice === 1;
  feedChoice = null;
  overlay.classList.remove('show');

  if (isSnack){
    state.hunger = clamp(state.hunger + 15);
    state.happiness = clamp(state.happiness + 5);
    state.weight += 1;
    showToast('Snack time!');
  } else {
    state.hunger = clamp(state.hunger + 35);
    state.weight += 3;
    showToast('Yum!');
  }
  beep(700,0.08);
  render();
  persist();
}

function doPlay(){
  if (!requireAliveAwakeGrown()) return;
  if (state.asleep){ showToast("It's asleep..."); return; }
  if (state.energy < 10){ showToast('Too tired to play'); return; }
  startMinigame();
}

/* ---------- Minigame: Higher or Lower, best of 5 ---------- */
var minigame = null; // transient, not persisted: {number, choice, resolved, round, wins}
var MG_ROUNDS = 5;

function randNum(){ return 1 + Math.floor(Math.random()*9); }

function startMinigame(){
  state.energy = clamp(state.energy - 7);
  state.weight = Math.max(10, state.weight - 2);
  persist();
  minigame = { number: randNum(), choice: 0, resolved: false, round: 1, wins: 0 };
  renderMinigame();
}

function renderMinigame(){
  if (!minigame) return;
  overlay.innerHTML = '';

  var title = document.createElement('div');
  title.style.fontSize = '10px';
  title.textContent = 'Higher or Lower? — Round ' + minigame.round + '/' + MG_ROUNDS;

  var score = document.createElement('div');
  score.style.fontSize = '9px'; score.style.color = '#999';
  score.textContent = 'Wins so far: ' + minigame.wins;

  var num = document.createElement('div');
  num.style.fontSize = '26px'; num.style.fontWeight = 'bold'; num.style.margin = '2px 0';
  num.textContent = minigame.number;

  var choices = document.createElement('div');
  choices.style.display = 'flex'; choices.style.gap = '10px';
  ['▲ Higher', '▼ Lower'].forEach(function(label, i){
    var b = document.createElement('div');
    b.textContent = label;
    b.style.padding = '6px 10px';
    b.style.border = '2px solid ' + (i === minigame.choice ? '#4de861' : '#555');
    b.style.borderRadius = '8px';
    b.style.fontSize = '11px';
    b.addEventListener('click', function(){ minigame.choice = i; resolveRound(); });
    choices.appendChild(b);
  });

  var hint = document.createElement('div');
  hint.style.fontSize = '8px'; hint.style.color = '#999'; hint.style.marginTop = '6px';
  hint.textContent = 'scroll to choose, press to guess';

  overlay.appendChild(title); overlay.appendChild(score); overlay.appendChild(num);
  overlay.appendChild(choices); overlay.appendChild(hint);
  overlay.classList.add('show');
}

function resolveRound(){
  if (!minigame || minigame.resolved) return;
  minigame.resolved = true;

  var next = randNum();
  while (next === minigame.number) next = randNum(); // avoid ties
  var guessedHigher = minigame.choice === 0;
  var win = (next > minigame.number) === guessedHigher;
  if (win) minigame.wins++;

  overlay.innerHTML = '';
  var res = document.createElement('div');
  res.className = win ? 'mg-win' : 'mg-lose';
  res.style.fontSize = '20px'; res.style.color = win ? '#4de861' : '#e85d4d';
  res.textContent = win ? '🎉 Correct!' : '💢 Wrong!';
  var detail = document.createElement('div');
  detail.style.fontSize = '10px'; detail.style.marginTop = '4px';
  detail.textContent = minigame.number + ' → ' + next;
  overlay.appendChild(res); overlay.appendChild(detail);

  beep(win ? 1100 : 350, win ? 0.08 : 0.15);

  setTimeout(function(){
    if (!minigame) return;
    if (minigame.round >= MG_ROUNDS) finishMinigame();
    else {
      minigame.round++;
      minigame.number = randNum();
      minigame.choice = 0;
      minigame.resolved = false;
      renderMinigame();
    }
  }, 900);
}

function finishMinigame(){
  var wins = minigame.wins;
  var overallWin = wins >= 3;
  var delta = overallWin ? (14 + (wins-3)*4) : -(14 + (2-wins)*4);
  state.happiness = clamp(state.happiness + delta);
  persist();

  overlay.innerHTML = '';
  var res = document.createElement('div');
  res.className = overallWin ? 'mg-win' : 'mg-lose';
  res.style.fontSize = '16px'; res.style.color = overallWin ? '#4de861' : '#e85d4d';
  res.textContent = overallWin ? ('You won ' + wins + '/' + MG_ROUNDS + '! 🎉') : ('Lost ' + wins + '/' + MG_ROUNDS + '... 💢');
  var sub = document.createElement('div');
  sub.style.fontSize = '9px'; sub.style.color = '#999'; sub.style.marginTop = '4px';
  sub.textContent = (delta > 0 ? '+' : '') + delta + ' happiness';
  overlay.appendChild(res); overlay.appendChild(sub);

  if (overallWin){ beep(1000,0.07); beep(1300,0.09); } else { beep(400,0.2); }

  setTimeout(function(){
    minigame = null;
    overlay.classList.remove('show');
    render();
    if (overallWin){
      startAnim('celebrate', 1500);
      showToast('We won! 🎉');
      beep(1200,0.05); beep(1500,0.05); beep(1800,0.08);
    } else {
      startAnim('sad', 1400);
      showToast('Aww, we lost...');
      beep(300,0.1); beep(240,0.15);
    }
  }, 1800);
}

function doClean(){
  if (!requireAliveAwakeGrown()) return;
  if (state.poop === 0){ showToast('Already clean'); return; }
  var wasVeryDirty = state.poop >= 5;
  state.poop = 0;
  if (wasVeryDirty) state.health = clamp(state.health + 3);
  showToast('Cleaned up!');
  beep(500,0.08);
}

function doMedicine(){
  if (!requireAliveAwakeGrown()) return;
  if (state.sick){
    state.sick = false;
    state.health = clamp(state.health + 10);
    showToast('Feeling better!');
    beep(1500,0.15);
  } else {
    state.happiness = clamp(state.happiness - 5);
    showToast('Yuck, not needed');
    beep(300,0.1);
  }
}

function doSleep(){
  if (!requireAliveAwakeGrown()) return;
  state.asleep = !state.asleep;
  showToast(state.asleep ? 'Good night...' : 'Good morning!');
  beep(state.asleep ? 400 : 800, 0.1);
}

function doDiscipline(){
  if (!requireAliveAwakeGrown()) return;
  disciplineMenu = { choice: 0 };
  renderDisciplineMenu();
}

/* ---------- Discipline menu: shows the fillable discipline bar + naughty status, confirm or back out ---------- */
var disciplineMenu = null; // transient, not persisted: {choice} 0=Discipline,1=Back

function renderDisciplineMenu(){
  if (!disciplineMenu) return;
  overlay.innerHTML = '';

  var title = document.createElement('div');
  title.textContent = 'Discipline';

  var status = document.createElement('div');
  status.style.fontSize = '10px'; status.style.marginTop = '2px';
  if (state.naughty && state.naughtyStat){
    var statIcon = { hunger:'🍔', happiness:'🙂', energy:'⚡' }[state.naughtyStat];
    var statVal = Math.round(state[state.naughtyStat]);
    status.textContent = 'Crying about ' + state.naughtyStat + '... ' + statIcon + ' bar is at ' + statVal + '%';
  } else {
    status.textContent = "It's behaving fine right now.";
  }

  var preAdult = state.hatchedAt && state.stage !== 'adult';
  if (preAdult){
    var label = document.createElement('div');
    label.style.fontSize = '8px'; label.style.color = '#999'; label.style.marginTop = '6px';
    label.textContent = 'Discipline ' + state.discipline + '/' + DISCIPLINE_MAX;
    var barWrap = document.createElement('div');
    barWrap.className = 'disc-bar';
    barWrap.style.margin = '4px 0';
    var barFill = document.createElement('i');
    barFill.style.width = (state.discipline / DISCIPLINE_MAX * 100) + '%';
    barWrap.appendChild(barFill);
    overlay.appendChild(title); overlay.appendChild(status); overlay.appendChild(label); overlay.appendChild(barWrap);
  } else {
    overlay.appendChild(title); overlay.appendChild(status);
  }

  var choices = document.createElement('div');
  choices.style.display = 'flex'; choices.style.gap = '10px'; choices.style.marginTop = '6px';
  ['✋ Discipline', '↩ Back'].forEach(function(label, i){
    var b = document.createElement('div');
    b.textContent = label;
    b.style.padding = '6px 10px';
    b.style.border = '2px solid ' + (i === disciplineMenu.choice ? '#4de861' : '#555');
    b.style.borderRadius = '8px';
    b.style.fontSize = '11px';
    b.addEventListener('click', function(){ disciplineMenu.choice = i; confirmDisciplineMenu(); });
    choices.appendChild(b);
  });

  var hint = document.createElement('div');
  hint.style.fontSize = '8px'; hint.style.color = '#999'; hint.style.marginTop = '6px';
  hint.textContent = 'scroll to choose, press to confirm';

  overlay.appendChild(choices); overlay.appendChild(hint);
  overlay.classList.add('show');
}

function confirmDisciplineMenu(){
  if (!disciplineMenu) return;
  var doIt = disciplineMenu.choice === 0;
  disciplineMenu = null;
  overlay.classList.remove('show');
  if (doIt) applyDiscipline();
  render();
  persist();
}

function applyDiscipline(){
  if (state.naughty){
    state.naughty = false;
    state.naughtyStat = null;
    state.naughtyDeadline = null;
    state.happiness = clamp(state.happiness - 3);
    state.discipline = Math.min(DISCIPLINE_MAX, state.discipline + 1);
    showToast('Caught you fibbing! (' + state.discipline + '/' + DISCIPLINE_MAX + ')');
    beep(500,0.1); beep(650,0.1);
  } else {
    state.happiness = clamp(state.happiness - 15);
    showToast('That was uncalled for!');
    beep(220,0.2);
  }
}

function activateSelected(){
  if (minigame){
    if (!minigame.resolved) resolveRound();
    return;
  }
  if (feedChoice){ confirmFeedChoice(); return; }
  if (disciplineMenu){ confirmDisciplineMenu(); return; }
  if (!state || !state.alive) return;
  var id = ICONS[selected].id;
  if (id === 'feed') doFeed();
  else if (id === 'play') doPlay();
  else if (id === 'clean') doClean();
  else if (id === 'med') doMedicine();
  else if (id === 'sleep') doSleep();
  else if (id === 'discipline') doDiscipline();
  render();
  persist();
}

function resetGame(){
  state = freshState();
  render();
  persist();
}

/* ---------- Sound ---------- */
function beep(freq, dur){
  if (!state || !state.soundOn) return;
  try{
    beep.ctx = beep.ctx || new (window.AudioContext || window.webkitAudioContext)();
    var ctx = beep.ctx;
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = freq || 800; o.type = 'square';
    g.gain.value = 0.05;
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime + (dur || 0.08));
  }catch(e){}
}

/* ---------- Toast ---------- */
var toastEl = document.getElementById('toast');
var toastTimer = null;
function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 4800);
}

/* ---------- Rendering ---------- */
var canvas = document.getElementById('stage-canvas');
var ctx = canvas.getContext('2d');
var W = canvas.width, H = canvas.height;
var hud = document.getElementById('hud');
var overlay = document.getElementById('overlay');
var menuEl = document.getElementById('menu');
var anim = null;
var IDLE_BOB_PERIOD = 1100; // ms, gentle continuous breathing bob

function startAnim(type, duration){
  anim = { type: type, start: performance.now(), duration: duration || 550 };
}

// Snappy "hop" easing: quick eased rise to a peak, then a softer gravity-like
// fall — reads bouncier than a plain symmetric sine wave.
function bounceEase(t){
  if (t < 0.4){
    var u = t/0.4;
    return u*u*(3-2*u); // smoothstep rise
  }
  var u = (t-0.4)/0.6;
  return 1 - u*u; // eased fall
}

// Continuous redraw loop so idle bobbing/hops and mood animations are
// smooth, independent of the 1s game-tick cadence.
function frameLoop(now){
  if (anim && now - anim.start > anim.duration) anim = null;
  if (state) drawPet();
  requestAnimationFrame(frameLoop);
}

function scheduleIdleHop(){
  var delay = 4000 + Math.random() * 5000; // 4-9s
  setTimeout(function(){
    if (state && state.alive && state.stage !== 'egg' && !state.asleep && !anim){
      startAnim('hop', 380);
    }
    scheduleIdleHop();
  }, delay);
}

function buildMenu(){
  menuEl.innerHTML = '';
  ICONS.forEach(function(icon, i){
    var b = document.createElement('div');
    b.className = 'icon-btn' + (i === selected ? ' selected' : '');
    b.textContent = icon.label;
    b.addEventListener('click', function(){
      selected = i;
      activateSelected();
    });
    menuEl.appendChild(b);
  });
}

function moveSelection(dir){
  if (minigame && !minigame.resolved){
    minigame.choice = dir < 0 ? 0 : 1;
    renderMinigame();
    return;
  }
  if (feedChoice){
    feedChoice.choice = dir < 0 ? 0 : 1;
    renderFeedChoice();
    return;
  }
  if (disciplineMenu){
    disciplineMenu.choice = dir < 0 ? 0 : 1;
    renderDisciplineMenu();
    return;
  }
  if (!state) return;
  selected = (selected + dir + ICONS.length) % ICONS.length;
  render();
}

function setBar(cls, val){
  document.querySelector('.b-' + cls + ' > i').style.width = clamp(val) + '%';
}

function drawPoop(x, y){
  ctx.fillStyle = '#6b4423';
  ctx.beginPath();
  ctx.ellipse(x, y, 5, 4, 0, 0, Math.PI*2);
  ctx.fill();
}

// Snore-puff Zzz: 3 letters loop continuously, each drifting up and to the
// side while growing and fading, staggered like a breathing/snoring rhythm.
function drawZzz(x, y){
  var now = performance.now();
  var prevAlign = ctx.textAlign;
  ctx.textAlign = 'left';
  ctx.lineWidth = 2;
  for (var i=0; i<3; i++){
    var phase = ((now/1500 + i/3) % 1);
    var fontSize = 9 + i*3 + phase*6;
    var lx = x + i*8 + phase*6;
    var ly = y - phase*20;
    var alpha = phase < 0.15 ? phase/0.15 : (phase > 0.75 ? (1-phase)/0.25 : 1);
    ctx.font = 'bold ' + fontSize.toFixed(1) + 'px monospace';
    ctx.strokeStyle = 'rgba(10,14,39,' + (alpha*0.9).toFixed(2) + ')';
    ctx.fillStyle = 'rgba(255,255,255,' + alpha.toFixed(2) + ')';
    ctx.strokeText('Z', lx, ly);
    ctx.fillText('Z', lx, ly);
  }
  ctx.textAlign = prevAlign;
}

function drawTombstone(groundY){
  var rectH = 40, rectTop = groundY + 5 - rectH;
  ctx.fillStyle = '#888';
  ctx.fillRect(W/2-20, rectTop, 40, rectH);
  ctx.beginPath();
  ctx.arc(W/2, rectTop, 20, Math.PI, 0);
  ctx.fill();
  ctx.fillStyle = '#333';
  ctx.font = '10px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('RIP', W/2, rectTop+26);
}

function stageSize(stage){
  return { egg:18, baby:22, child:30, teen:38, adult:44 }[stage] || 24;
}

var STARS = [[20,14],[55,8],[95,20],[140,10],[178,24],[205,7],[36,30],[165,32],[8,40]];
var FLOOR_H = 46;

function drawCloud(x, y){
  ctx.beginPath();
  ctx.ellipse(x, y, 13, 8, 0, 0, Math.PI*2);
  ctx.ellipse(x+13, y-3, 10, 7, 0, 0, Math.PI*2);
  ctx.ellipse(x-12, y+2, 9, 6, 0, 0, Math.PI*2);
  ctx.fill();
}

function drawBackground(dark){
  ctx.fillStyle = dark ? '#0a0e27' : '#cfe8ff';
  ctx.fillRect(0,0,W,H);

  if (dark){
    ctx.fillStyle = 'rgba(255,255,255,.75)';
    for (var i=0; i<STARS.length; i++) ctx.fillRect(STARS[i][0], STARS[i][1], 2, 2);
    ctx.fillStyle = '#eef0e0';
    ctx.beginPath(); ctx.arc(W-32, 30, 13, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#0a0e27';
    ctx.beginPath(); ctx.arc(W-26, 25, 11, 0, Math.PI*2); ctx.fill();
  } else {
    ctx.fillStyle = '#ffd75e';
    ctx.beginPath(); ctx.arc(W-32, 30, 14, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    var drift = (performance.now()/1000 * 6) % (W+60);
    drawCloud(drift-30, 34);
    drawCloud(((drift+130) % (W+60))-30, 54);
  }

  var groundY = H - FLOOR_H;
  ctx.fillStyle = dark ? '#141a3d' : '#8fcf7f';
  ctx.fillRect(0, groundY, W, FLOOR_H);
  ctx.fillStyle = dark ? '#0d1128' : '#6fae5f';
  ctx.fillRect(0, groundY+13, W, FLOOR_H-13);

  return groundY;
}

function drawPet(){
  var hour = new Date().getHours();
  var isNight = hour < 7 || hour >= 21;
  var dark = isNight || state.asleep;

  ctx.clearRect(0,0,W,H);
  var groundY = drawBackground(dark);

  for (var i=0; i<Math.min(state.poop,6); i++){
    drawPoop(18 + i*36, groundY + 36);
  }

  if (!state.alive){ drawTombstone(groundY); return; }

  var cx = W/2;
  var groundHalf = state.stage === 'egg' ? 28 : stageSize(state.stage) * 0.9;
  var cy = groundY + 5 - groundHalf;

  if (state.alive && state.stage !== 'egg' && !state.asleep){
    var idleT = (performance.now() % IDLE_BOB_PERIOD) / IDLE_BOB_PERIOD;
    cy -= Math.sin(idleT * Math.PI * 2) * 4;
  }

  if (anim){
    var t = Math.min(1, (performance.now() - anim.start) / anim.duration);
    if (anim.type === 'bounce') cy -= bounceEase(t) * 13;
    else if (anim.type === 'hop') cy -= bounceEase(t) * 7;
    else if (anim.type === 'shake') cx += Math.sin(t*Math.PI*10) * 6 * (1-t);
    else if (anim.type === 'droop') cy += Math.sin(t*Math.PI) * 6;
    else if (anim.type === 'celebrate'){
      var cycles = 3;
      var ct = (t * cycles) % 1;
      cy -= bounceEase(ct) * 16;
      cx += Math.sin(t * Math.PI * cycles * 2) * 4;
    }
    else if (anim.type === 'sad'){
      var down = Math.min(1, t/0.25); down = down*down*(3-2*down);
      var up = t > 0.8 ? (t-0.8)/0.2 : 0; up = up*up*(3-2*up);
      cy += (down - up) * 9;
      if (t > 0.25 && t < 0.8) cx += Math.sin(t * Math.PI * 16) * 1.3;
    }
  }

  if (state.stage === 'egg'){
    ctx.fillStyle = '#f5ecd7';
    ctx.strokeStyle = '#c9b98a';
    ctx.beginPath();
    ctx.ellipse(cx, cy, 22, 28, 0, 0, Math.PI*2);
    ctx.fill(); ctx.stroke();
    var progress = (Date.now() - state.born) / EGG_HATCH_MS;
    if (progress > 0.5){
      ctx.strokeStyle = '#8a7a52';
      ctx.beginPath();
      ctx.moveTo(cx-10, cy-15); ctx.lineTo(cx, cy); ctx.lineTo(cx-4, cy+12);
      ctx.stroke();
    }
    return;
  }

  var size = stageSize(state.stage);
  var goodForm = state.evolutionForm !== 'bad';
  var hue = state.stage === 'adult' ? (goodForm ? '#5ec96a' : '#7a5ec9')
                                     : (state.sick ? '#9fcf7a' : '#f2c94c');

  ctx.fillStyle = hue;
  ctx.beginPath();
  if (state.stage === 'adult' && !goodForm){
    // spiky grumpy form
    var spikes = 8, outer = size, inner = size*0.65;
    ctx.moveTo(cx + outer, cy);
    for (var s=1; s<=spikes*2; s++){
      var r = (s % 2 === 0) ? outer : inner;
      var ang = Math.PI * s / spikes;
      ctx.lineTo(cx + r*Math.cos(ang), cy + r*Math.sin(ang));
    }
    ctx.closePath();
  } else {
    ctx.ellipse(cx, cy, size, size*0.9, 0, 0, Math.PI*2);
  }
  ctx.fill();

  // limbs for child/teen/adult
  if (state.stage !== 'baby'){
    ctx.fillStyle = hue;
    ctx.beginPath(); ctx.ellipse(cx-size*0.9, cy+size*0.6, 5, 8, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx+size*0.9, cy+size*0.6, 5, 8, 0, 0, Math.PI*2); ctx.fill();
  }

  // eyes
  var eyeY = cy - size*0.15, eyeDX = size*0.35;
  ctx.fillStyle = '#222';
  if (state.asleep){
    ctx.strokeStyle = '#222'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(cx-eyeDX-4, eyeY); ctx.lineTo(cx-eyeDX+4, eyeY); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx+eyeDX-4, eyeY); ctx.lineTo(cx+eyeDX+4, eyeY); ctx.stroke();
    drawZzz(cx+size*0.5, cy-size*0.7);
  } else if (state.sick){
    ctx.font = (size*0.5)+'px monospace';
    ctx.fillText('@', cx-eyeDX-4, eyeY+4);
    ctx.fillText('@', cx+eyeDX-4, eyeY+4);
  } else {
    ctx.beginPath(); ctx.arc(cx-eyeDX, eyeY, 3, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx+eyeDX, eyeY, 3, 0, Math.PI*2); ctx.fill();
  }

  // mouth: smile if doing well, frown if not
  var mood = (state.hunger + state.happiness + state.energy) / 3;
  ctx.strokeStyle = '#222'; ctx.lineWidth = 2;
  ctx.beginPath();
  if (!state.asleep){
    if (mood > 50) ctx.arc(cx, cy+size*0.25, size*0.3, 0.15*Math.PI, 0.85*Math.PI);
    else ctx.arc(cx, cy+size*0.45, size*0.3, 1.15*Math.PI, 1.85*Math.PI);
    ctx.stroke();
  }
}

function render(){
  buildMenu();
  setBar('hunger', state.hunger);
  setBar('happy', state.happiness);
  setBar('energy', state.energy);
  setBar('health', state.health);

  var ageText = '';
  if (state.hatchedAt){
    var years = (Date.now()-state.hatchedAt) * YEARS_PER_MS;
    ageText = years.toFixed(1) + 'y · ' + state.stage;
  } else {
    ageText = 'egg';
  }
  hud.textContent = ageText + (state.sick ? ' · sick' : '') + (state.naughty ? ' · naughty' : '');

  if (!state.alive){
    overlay.innerHTML = '';
    var t = document.createElement('div'); t.textContent = 'It passed away.';
    var t2 = document.createElement('div'); t2.style.fontSize='9px'; t2.style.color='#999';
    t2.textContent = 'Cause: ' + (state.deathReason || 'unknown');
    var t3 = document.createElement('div'); t3.style.fontSize='9px'; t3.style.color='#999';
    var ageAtDeath = state.hatchedAt ? ((Date.now()-state.hatchedAt)*YEARS_PER_MS).toFixed(1) : '0.0';
    t3.textContent = 'Age: ' + ageAtDeath + ' years';
    var btn = document.createElement('button'); btn.textContent = 'New Egg';
    btn.addEventListener('click', resetGame);
    overlay.appendChild(t); overlay.appendChild(t2); overlay.appendChild(t3); overlay.appendChild(btn);
    overlay.classList.add('show');
  } else if (!minigame && !feedChoice && !disciplineMenu){
    overlay.classList.remove('show');
  }

  if (state.firstRun){
    state.firstRun = false;
    showToast('Scroll to choose, press to use');
  }
}

/* ---------- Attitude: idle personality moments ---------- */
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

function triggerAttitude(){
  scheduleAttitude();
  if (!state || !state.alive || document.hidden) return;

  var pool, animType;
  if (state.stage === 'egg'){ pool = ATTITUDE_LINES.egg; animType = 'shake'; }
  else if (state.asleep){ return; }
  else if (state.sick){ pool = ATTITUDE_LINES.sick; animType = 'shake'; }
  else if (state.naughty){ pool = ATTITUDE_LINES.naughty; animType = 'shake'; }
  else if (state.hunger <= 25){ pool = ATTITUDE_LINES.hungry; animType = 'shake'; }
  else if (state.energy <= 20){ pool = ATTITUDE_LINES.tired; animType = 'droop'; }
  else if (state.poop >= 4){ pool = ATTITUDE_LINES.dirty; animType = 'shake'; }
  else if (state.happiness <= 30){ pool = ATTITUDE_LINES.bored; animType = 'droop'; }
  else if (state.stage === 'adult' && state.evolutionForm === 'bad'){ pool = ATTITUDE_LINES.sassy; animType = 'bounce'; }
  else if (state.stage === 'adult'){ pool = ATTITUDE_LINES.sweet; animType = 'bounce'; }
  else { pool = ATTITUDE_LINES.happy; animType = 'bounce'; }

  showToast(pick(pool));
  startAnim(animType);
  beep(animType === 'bounce' ? 1100 : (animType === 'shake' ? 500 : 700), 0.06);
}

function scheduleAttitude(){
  var delay = ATTITUDE_MIN_MS + Math.random() * (ATTITUDE_MAX_MS - ATTITUDE_MIN_MS);
  setTimeout(triggerAttitude, delay);
}

/* ---------- Main loop ---------- */
function tick(){
  applyDecay(1000);
  render();
  persist();
}

function persist(){
  state.lastTick = Date.now();
  Storage.set(STORE_KEY, state);
  updateDiagHud();
}

function startLoops(){
  setInterval(tick, 1000);
  scheduleAttitude();
  scheduleIdleHop();
  requestAnimationFrame(frameLoop);
  window.addEventListener('beforeunload', persist);
  document.addEventListener('visibilitychange', function(){
    if (document.hidden) persist();
  });
}

function hydrateState(loaded){
  // Fill in any fields missing from an older save (from before that field
  // existed) with fresh defaults, instead of leaving them undefined.
  var template = freshState();
  for (var key in template){
    if (loaded[key] === undefined) loaded[key] = template[key];
  }
  // Special case: a pet that already hatched under an older save needs its
  // own naughty schedule, not the null a fresh unhatched egg gets by default.
  if (loaded.hatchedAt && !loaded.nextNaughtyAt){
    loaded.nextNaughtyAt = Date.now() + 12*HOUR + Math.random()*12*HOUR;
  }
  return loaded;
}

function init(){
  Storage.get(STORE_KEY).then(function(result){
    if (result.value){
      state = hydrateState(result.value);
      var elapsed = Date.now() - (state.lastTick || Date.now());
      if (elapsed > 0) applyDecay(elapsed);
    } else {
      state = freshState();
    }
    render();
    startLoops();
    if (result.source === 'device') showToast('Save found (device storage)');
    else if (result.source === 'local') showToast('Save found (local backup)');
    else showToast('No save found - new egg');
    updateDiagHud();
  }).catch(function(){
    state = freshState();
    render();
    startLoops();
    showToast('Storage error - new egg');
    updateDiagHud();
  });
}

function updateDiagHud(){
  var el = document.getElementById('diag');
  if (!el) return;
  el.textContent = BUILD_ID + ' · CS:' + (Diag.hasDeviceStorage ? 'y' : 'n') +
    ' · save:' + (Diag.lastSaveOk === null ? '?' : (Diag.lastSaveOk ? 'ok' : 'FAIL'));
}

/* ---------- Input: R1 hardware events ---------- */
window.addEventListener('scrollUp',   function(){ moveSelection(-1); });
window.addEventListener('scrollDown', function(){ moveSelection(1); });
window.addEventListener('sideClick',  function(){ activateSelected(); });
window.addEventListener('longPressStart', function(){ longPressActive = true; });
window.addEventListener('longPressEnd',   function(){
  if (longPressActive){ activateSelected(); longPressActive = false; }
});

/* ---------- Input: desktop/browser fallback for testing ---------- */
document.addEventListener('keydown', function(e){
  if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') moveSelection(-1);
  else if (e.key === 'ArrowDown' || e.key === 'ArrowRight') moveSelection(1);
  else if (e.key === 'Enter' || e.key === ' ') activateSelected();
});

/* petting: tap the pet itself for a tiny happiness nudge */
var lastPet = 0;
canvas.addEventListener('click', function(){
  if (!state || !state.alive || state.stage === 'egg') return;
  var now = Date.now();
  if (now - lastPet < 4000) return;
  lastPet = now;
  state.happiness = clamp(state.happiness + 3);
  beep(1300,0.06); beep(1600,0.06);
  startAnim('bounce', 650);
  showToast(pick(ATTITUDE_LINES.petted));
  render();
});

init();
})();
</script>
</body>
</html>
